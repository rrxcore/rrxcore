<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070c"/>
      <stop offset="45%" stop-color="#0a0d17"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>

    <!-- Accent Gradient Cyan-Violet -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f2fe" stroke-width="0.7" stroke-opacity="0.06"/>
      <circle cx="0" cy="0" r="1" fill="#00f2fe" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }
    @keyframes scanline {
      0% { transform: translateY(-300px); }
      100% { transform: translateY(300px); }
    }
    .pulse-beacon {
      animation: pulseDot 2s infinite ease-in-out;
      transform-origin: 860px 45px;
    }
    .mono-font {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Courier New', monospace;
    }
    .sans-font {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
    }
  </style>

  <!-- Container Box with Rounded Edges -->
  <rect x="2" y="2" width="956" height="296" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Background Grid -->
  <rect x="2" y="2" width="956" height="296" rx="16" fill="url(#cyberGrid)"/>

  <!-- Glowing Outer Border -->
  <rect x="2" y="2" width="956" height="296" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Corner Tech Accents -->
  <!-- Top Left -->
  <path d="M 16 35 L 16 16 L 35 16" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
  <!-- Top Right -->
  <path d="M 925 16 L 944 16 L 944 35" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom Left -->
  <path d="M 16 265 L 16 284 L 35 284" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom Right -->
  <path d="M 925 284 L 944 284 L 944 265" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>

  <!-- Background Ambient Glow Orbs -->
  <circle cx="140" cy="110" r="90" fill="#00f2fe" fill-opacity="0.05" filter="url(#neonGlow)"/>
  <circle cx="820" cy="180" r="110" fill="#8b5cf6" fill-opacity="0.06" filter="url(#neonGlow)"/>

  <!-- Top System Status Pill -->
  <g transform="translate(50, 32)">
    <rect x="0" y="0" width="310" height="26" rx="13" fill="url(#badgeGrad)" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#00ff88" filter="url(#softGlow)"/>
    <text x="26" y="17" fill="#67e8f9" font-size="11" font-weight="600" class="mono-font" letter-spacing="1">SYSTEM READY // RRXCORE-ARCH-V2</text>
  </g>

  <!-- Live Pulse Beacon (Top Right) -->
  <g class="pulse-beacon">
    <circle cx="880" cy="45" r="8" fill="#00f2fe" fill-opacity="0.2"/>
    <circle cx="880" cy="45" r="4" fill="#00f2fe" filter="url(#softGlow)"/>
  </g>
  <text x="865" y="49" fill="#94a3b8" font-size="11" text-anchor="end" class="mono-font" letter-spacing="0.5">LATENCY: &lt;15ms</text>

  <!-- Main Hero Brand Name -->
  <g transform="translate(50, 125)">
    <!-- Sub-label -->
    <text x="2" y="-12" fill="#38bdf8" font-size="13" font-weight="700" class="mono-font" letter-spacing="3">HELLO WORLD, I AM</text>
    
    <!-- Big Title: RANA / rrxcore -->
    <text x="0" y="44" fill="url(#accentGrad)" font-size="52" font-weight="900" class="sans-font" letter-spacing="2" filter="url(#softGlow)">
      RANA <tspan fill="#64748b" font-weight="300">/</tspan> <tspan fill="#f8fafc">rrxcore</tspan>
    </text>
  </g>

  <!-- Role & Specialization Subtitle -->
  <g transform="translate(50, 195)">
    <text x="0" y="10" fill="#e2e8f0" font-size="19" font-weight="600" class="sans-font">
      Systems Engineer <tspan fill="#00f2fe">•</tspan> Applied AI Architect <tspan fill="#8b5cf6">•</tspan> Hackathon Innovator
    </text>
    <text x="0" y="32" fill="#94a3b8" font-size="13.5" font-weight="400" class="sans-font">
      Specialized in Low-Latency C++ Engines, Zero-Knowledge Cryptography &amp; Statutory Legal RAG Pipelines
    </text>
  </g>

  <!-- Bottom Interactive Tech Pills / Matrix -->
  <g transform="translate(50, 252)">
    <!-- Pill 1: WASAPI / C++ -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="130" height="24" rx="6" fill="#0f172a" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1"/>
      <text x="65" y="16" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle" class="mono-font">⚡ C++ / WASAPI</text>
    </g>

    <!-- Pill 2: WebCrypto E2EE -->
    <g transform="translate(140, 0)">
      <rect x="0" y="0" width="150" height="24" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
      <text x="75" y="16" fill="#c084fc" font-size="11" font-weight="600" text-anchor="middle" class="mono-font">🔒 WebCrypto E2EE</text>
    </g>

    <!-- Pill 3: SIH 2026 RAG Engine -->
    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="165" height="24" rx="6" fill="#0f172a" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
      <text x="82.5" y="16" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle" class="mono-font">🌿 SIH 2026 AI RAG</text>
    </g>

    <!-- Pill 4: React 19 / TanStack 60FPS -->
    <g transform="translate(475, 0)">
      <rect x="0" y="0" width="180" height="24" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
      <text x="90" y="16" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle" class="mono-font">🚀 React 19 • 60 FPS</text>
    </g>

    <!-- Terminal Code Tag on right -->
    <g transform="translate(685, 0)">
      <rect x="0" y="0" width="175" height="24" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
      <text x="87.5" y="16" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle" class="mono-font">git commit -m "build"</text>
    </g>
  </g>
</svg>
