<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03060c"/>
      <stop offset="50%" stop-color="#060c18"/>
      <stop offset="100%" stop-color="#020407"/>
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="clientNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#040914"/>
    </linearGradient>

    <linearGradient id="serverNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140d24"/>
      <stop offset="100%" stop-color="#080512"/>
    </linearGradient>

    <!-- Wire Glow Gradients -->
    <linearGradient id="wireCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="wirePurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="packetGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f2fe" stroke-width="0.5" stroke-opacity="0.04"/>
      <circle cx="0" cy="0" r="1" fill="#00f2fe" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <style>
    <![CDATA[
    /* Continuous Flow Animation (HyperFrames Self-Drawing and Packet Traveling) */
    @keyframes dashStream {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes packetMove1 {
      0% { transform: translateX(0px); opacity: 0; }
      10% { opacity: 1; }
      45% { transform: translateX(200px); opacity: 1; }
      50% { transform: translateX(200px); opacity: 0; }
      100% { transform: translateX(200px); opacity: 0; }
    }
    @keyframes packetMove2 {
      0% { transform: translateX(0px); opacity: 0; }
      48% { transform: translateX(0px); opacity: 0; }
      55% { opacity: 1; }
      90% { transform: translateX(200px); opacity: 1; }
      100% { transform: translateX(200px); opacity: 0; }
    }
    @keyframes nodePulseSender {
      0%, 100% { stroke: #00f2fe; stroke-opacity: 0.4; }
      20% { stroke: #00f2fe; stroke-opacity: 1; }
      45% { stroke: #00f2fe; stroke-opacity: 0.4; }
    }
    @keyframes nodePulseServer {
      0%, 100% { stroke: #8b5cf6; stroke-opacity: 0.4; }
      45% { stroke: #8b5cf6; stroke-opacity: 1; }
      70% { stroke: #8b5cf6; stroke-opacity: 0.4; }
    }
    @keyframes nodePulseReceiver {
      0%, 100% { stroke: #34d399; stroke-opacity: 0.4; }
      75% { stroke: #34d399; stroke-opacity: 1; }
      95% { stroke: #34d399; stroke-opacity: 0.4; }
    }
    @keyframes badgeBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .flow-wire-1 {
      stroke-dasharray: 6 6;
      animation: dashStream 1.5s linear infinite;
    }
    .flow-wire-2 {
      stroke-dasharray: 6 6;
      animation: dashStream 1.5s linear infinite;
    }
    .traveling-packet-1 {
      animation: packetMove1 4.5s ease-in-out infinite;
    }
    .traveling-packet-2 {
      animation: packetMove2 4.5s ease-in-out infinite;
    }
    .sender-box {
      animation: nodePulseSender 4.5s ease-in-out infinite;
    }
    .server-box {
      animation: nodePulseServer 4.5s ease-in-out infinite;
    }
    .receiver-box {
      animation: nodePulseReceiver 4.5s ease-in-out infinite;
    }
    .live-dot {
      animation: badgeBlink 2s infinite ease-in-out;
    }
    .mono {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    }
    ]]>
  </style>

  <!-- ================= CANVAS BASE ================= -->
  <rect width="960" height="380" rx="14" fill="url(#archBg)"/>
  <rect width="960" height="380" rx="14" fill="url(#archGrid)"/>
  <rect x="2" y="2" width="956" height="376" rx="13" fill="none" stroke="#00f2fe" stroke-opacity="0.2" stroke-width="1.2"/>

  <!-- Top Console Header -->
  <g transform="translate(30, 28)">
    <!-- Traffic lights -->
    <circle cx="0" cy="0" r="3.5" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="11" cy="0" r="3.5" fill="#eab308" fill-opacity="0.8"/>
    <circle cx="22" cy="0" r="3.5" fill="#22c55e" fill-opacity="0.8"/>
    
    <text x="38" y="4" fill="#67e8f9" font-size="10.5" font-weight="700" class="mono" letter-spacing="2">
      SYSTEMS ARCHITECTURE // ZERO-KNOWLEDGE E2EE CIPHER PIPELINE
    </text>
    
    <!-- Live status pill on right -->
    <g transform="translate(750, -10)">
      <rect x="0" y="0" width="150" height="22" rx="11" fill="#081426" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="12" cy="11" r="3.5" fill="#00ff88" class="live-dot" filter="url(#softGlow)"/>
      <text x="22" y="15" fill="#38bdf8" font-size="9" font-weight="700" class="mono">LIVE WIRE FLOW</text>
    </g>
  </g>

  <line x1="30" y1="42" x2="930" y2="42" stroke="#00f2fe" stroke-opacity="0.15" stroke-width="1"/>

  <!-- ================= CONNECTION WIRES & DATA BUS ================= -->
  <!-- Wire 1: Sender ➔ Server -->
  <g transform="translate(290, 185)">
    <!-- Main Conduit Backing -->
    <line x1="0" y1="0" x2="200" y2="0" stroke="#0f1d36" stroke-width="6" stroke-linecap="round"/>
    <!-- Animated Glowing Dash Flow -->
    <line x1="0" y1="0" x2="200" y2="0" stroke="url(#wireCyan)" stroke-width="2.5" class="flow-wire-1" stroke-linecap="round"/>
    
    <!-- Data Stream Label -->
    <rect x="35" y="-22" width="130" height="18" rx="4" fill="#050c1c" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="100" y="-10" text-anchor="middle" fill="#67e8f9" font-size="8" font-weight="700" class="mono">
      AES-256-GCM Payload
    </text>

    <!-- Animated Data Packet 1 (Shooting pulse) -->
    <g class="traveling-packet-1">
      <circle cx="0" cy="0" r="5" fill="#00f2fe" filter="url(#packetGlow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Wire 2: Server ➔ Receiver -->
  <g transform="translate(570, 185)">
    <!-- Main Conduit Backing -->
    <line x1="0" y1="0" x2="200" y2="0" stroke="#180e2b" stroke-width="6" stroke-linecap="round"/>
    <!-- Animated Glowing Dash Flow -->
    <line x1="0" y1="0" x2="200" y2="0" stroke="url(#wirePurple)" stroke-width="2.5" class="flow-wire-2" stroke-linecap="round"/>
    
    <!-- Data Stream Label -->
    <rect x="35" y="-22" width="130" height="18" rx="4" fill="#090517" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="100" y="-10" text-anchor="middle" fill="#c084fc" font-size="8" font-weight="700" class="mono">
      Blind Ciphertext Relay
    </text>

    <!-- Animated Data Packet 2 (Shooting pulse) -->
    <g class="traveling-packet-2">
      <circle cx="0" cy="0" r="5" fill="#34d399" filter="url(#packetGlow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- ================= NODE 1: SENDER CLIENT ================= -->
  <g transform="translate(40, 75)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="250" height="220" rx="10" fill="url(#clientNodeGrad)" stroke="#00f2fe" stroke-width="1.4" class="sender-box" filter="url(#softGlow)"/>
    
    <!-- Node Header -->
    <rect x="0" y="0" width="250" height="34" rx="10" fill="#091830"/>
    <circle cx="16" cy="17" r="4" fill="#00f2fe" filter="url(#softGlow)"/>
    <text x="28" y="21" fill="#ffffff" font-size="11" font-weight="800" class="sans" letter-spacing="1">1. SENDER CLIENT</text>
    <text x="238" y="21" text-anchor="end" fill="#38bdf8" font-size="8" font-weight="600" class="mono">MEMORY</text>

    <!-- Step Items inside Node 1 -->
    <g transform="translate(14, 52)">
      <!-- Step 1.1 -->
      <rect x="0" y="0" width="222" height="42" rx="6" fill="#050e1f" stroke="#00f2fe" stroke-opacity="0.25" stroke-width="1"/>
      <text x="10" y="18" fill="#38bdf8" font-size="9" font-weight="700" class="mono">🔑 ECDH P-256 Keypair</text>
      <text x="10" y="32" fill="#94a3b8" font-size="8" class="sans">Generated in-browser (SubtleCrypto)</text>
    </g>

    <g transform="translate(14, 102)">
      <!-- Step 1.2 -->
      <rect x="0" y="0" width="222" height="42" rx="6" fill="#050e1f" stroke="#00f2fe" stroke-opacity="0.25" stroke-width="1"/>
      <text x="10" y="18" fill="#38bdf8" font-size="9" font-weight="700" class="mono">⚡ HKDF-SHA256 Derivation</text>
      <text x="10" y="32" fill="#94a3b8" font-size="8" class="sans">Derives 256-bit symmetric session key</text>
    </g>

    <g transform="translate(14, 152)">
      <!-- Step 1.3 -->
      <rect x="0" y="0" width="222" height="42" rx="6" fill="#050e1f" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1"/>
      <text x="10" y="18" fill="#00ff88" font-size="9" font-weight="700" class="mono">🔒 AES-256-GCM Cipher</text>
      <text x="10" y="32" fill="#94a3b8" font-size="8" class="sans">Unique 96-bit random IV per message</text>
    </g>
  </g>

  <!-- ================= NODE 2: BLIND RELAY SERVER ================= -->
  <g transform="translate(355, 75)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="250" height="220" rx="10" fill="url(#serverNodeGrad)" stroke="#8b5cf6" stroke-width="1.4" class="server-box" filter="url(#softGlow)"/>
    
    <!-- Node Header -->
    <rect x="0" y="0" width="250" height="34" rx="10" fill="#1b1133"/>
    <circle cx="16" cy="17" r="4" fill="#a855f7" filter="url(#softGlow)"/>
    <text x="28" y="21" fill="#ffffff" font-size="11" font-weight="800" class="sans" letter-spacing="1">2. BLIND RELAY SERVER</text>
    <text x="238" y="21" text-anchor="end" fill="#c084fc" font-size="8" font-weight="600" class="mono">ZERO-KNOWLEDGE</text>

    <!-- Step Items inside Node 2 -->
    <g transform="translate(14, 52)">
      <!-- Step 2.1 -->
      <rect x="0" y="0" width="222" height="42" rx="6" fill="#0f071f" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="1"/>
      <text x="10" y="18" fill="#c084fc" font-size="9" font-weight="700" class="mono">📡 Dumb Packet Ingestion</text>
      <text x="10" y="32" fill="#94a3b8" font-size="8" class="sans">Relays raw Base64 wire bytes only</text>
    </g>

    <g transform="translate(14, 102)">
      <!-- Step 2.2 -->
      <rect x="0" y="0" width="222" height="42" rx="6" fill="#0f071f" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
      <text x="10" y="18" fill="#ef4444" font-size="9" font-weight="700" class="mono">❌ Zero Private Keys / Plaintext</text>
      <text x="10" y="32" fill="#94a3b8" font-size="8" class="sans">Mathematically unable to decrypt</text>
    </g>

    <g transform="translate(14, 152)">
      <!-- Step 2.3 -->
      <rect x="0" y="0" width="222" height="42" rx="6" fill="#0f071f" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="1"/>
      <text x="10" y="18" fill="#38bdf8" font-size="9" font-weight="700" class="mono">🔄 Socket.io Instant Dispatch</text>
      <text x="10" y="32" fill="#94a3b8" font-size="8" class="sans">Sub-millisecond wire forwarding</text>
    </g>
  </g>

  <!-- ================= NODE 3: RECEIVER CLIENT ================= -->
  <g transform="translate(670, 75)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="250" height="220" rx="10" fill="url(#clientNodeGrad)" stroke="#34d399" stroke-width="1.4" class="receiver-box" filter="url(#softGlow)"/>
    
    <!-- Node Header -->
    <rect x="0" y="0" width="250" height="34" rx="10" fill="#09241b"/>
    <circle cx="16" cy="17" r="4" fill="#34d399" filter="url(#softGlow)"/>
    <text x="28" y="21" fill="#ffffff" font-size="11" font-weight="800" class="sans" letter-spacing="1">3. RECEIVER CLIENT</text>
    <text x="238" y="21" text-anchor="end" fill="#34d399" font-size="8" font-weight="600" class="mono">SECURED</text>

    <!-- Step Items inside Node 3 -->
    <g transform="translate(14, 52)">
      <!-- Step 3.1 -->
      <rect x="0" y="0" width="222" height="42" rx="6" fill="#041410" stroke="#34d399" stroke-opacity="0.25" stroke-width="1"/>
      <text x="10" y="18" fill="#34d399" font-size="9" font-weight="700" class="mono">🔑 Session Key Agreement</text>
      <text x="10" y="32" fill="#94a3b8" font-size="8" class="sans">Computed via peer's public key</text>
    </g>

    <g transform="translate(14, 102)">
      <!-- Step 3.2 -->
      <rect x="0" y="0" width="222" height="42" rx="6" fill="#041410" stroke="#34d399" stroke-opacity="0.4" stroke-width="1"/>
      <text x="10" y="18" fill="#00ff88" font-size="9" font-weight="700" class="mono">🔓 In-Memory AES Decryption</text>
      <text x="10" y="32" fill="#94a3b8" font-size="8" class="sans">Plaintext rendered strictly to DOM</text>
    </g>

    <g transform="translate(14, 152)">
      <!-- Step 3.3 -->
      <rect x="0" y="0" width="222" height="42" rx="6" fill="#041410" stroke="#34d399" stroke-opacity="0.25" stroke-width="1"/>
      <text x="10" y="18" fill="#67e8f9" font-size="9" font-weight="700" class="mono">🛡️ 60-Digit SHA-256 Safety</text>
      <text x="10" y="32" fill="#94a3b8" font-size="8" class="sans">Deterministic MITM verification</text>
    </g>
  </g>

  <!-- ================= BOTTOM TELEMETRY SPECIFICATIONS BAR ================= -->
  <g transform="translate(40, 315)">
    <rect x="0" y="0" width="880" height="40" rx="8" fill="#060c18" stroke="#00f2fe" stroke-opacity="0.25" stroke-width="1"/>

    <!-- Spec 1 -->
    <g transform="translate(25, 25)">
      <circle cx="0" cy="-4" r="3" fill="#00ff88"/>
      <text x="10" y="0" fill="#94a3b8" font-size="9" font-weight="600" class="mono">CRYPTOGRAPHY: <tspan fill="#ffffff" font-weight="700">W3C WebCrypto API</tspan></text>
    </g>

    <!-- Spec 2 -->
    <g transform="translate(255, 25)">
      <circle cx="0" cy="-4" r="3" fill="#00f2fe"/>
      <text x="10" y="0" fill="#94a3b8" font-size="9" font-weight="600" class="mono">CIPHER: <tspan fill="#ffffff" font-weight="700">AES-256-GCM + IV</tspan></text>
    </g>

    <!-- Spec 3 -->
    <g transform="translate(485, 25)">
      <circle cx="0" cy="-4" r="3" fill="#8b5cf6"/>
      <text x="10" y="0" fill="#94a3b8" font-size="9" font-weight="600" class="mono">KEY DERIVATION: <tspan fill="#ffffff" font-weight="700">HKDF-SHA256</tspan></text>
    </g>

    <!-- Spec 4 -->
    <g transform="translate(715, 25)">
      <circle cx="0" cy="-4" r="3" fill="#34d399"/>
      <text x="10" y="0" fill="#94a3b8" font-size="9" font-weight="600" class="mono">DATA RETENTION: <tspan fill="#34d399" font-weight="700">0 KB (Zero-Server)</tspan></text>
    </g>
  </g>
</svg>
